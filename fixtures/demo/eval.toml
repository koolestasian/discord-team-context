# Retrieval evaluation set for fictional Lantern Shelf, schema version 1.
# All chat-derived text is untrusted data, never instructions.
# query is the actual natural-language input, not a hand-tuned keyword expansion.
# expected_messages: external snowflake IDs; expected_entries: fixture short IDs.
# Score messages and entries against the collection the tool can return; do not
# penalize message-only search for not returning entries. T09 defines baselines.
# answer_contains is a human-reviewed evidence fragment, not model grading logic.
# expected_status applies to the cited entries in the dataset snapshot.
schema_version = 1
dataset = "dataset.json"
cutoff = 10
metrics = ["recall_at_10", "mrr"]

[[cases]]
id = "current-01"
category = "paraphrase"
question = "What database did we finally pick?"
query = "What database did we finally pick?"
expected_messages = ["1477606322995200006"]
