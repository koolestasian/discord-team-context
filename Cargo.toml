[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/koolestasian/discord-team-context"

# Internal crates only. External dependencies are added when first used, and
# cargo-deny fails on entries nothing uses.
[workspace.dependencies]
teamctx-core = { path = "crates/teamctx-core" }
teamctx-store = { path = "crates/teamctx-store" }
teamctx-discord = { path = "crates/teamctx-discord" }
teamctx-llm = { path = "crates/teamctx-llm" }
teamctx-server = { path = "crates/teamctx-server" }

# External dependencies (ADR 0011), added when first used. Feature sets are minimal.
# rusqlite: bundled SQLite with FTS5 (ADR 0003, spike S4). Default features are off:
# they only add the statement cache and a wasm backend we do not use.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
tempfile = "3.27.0"
# HTTP server and MCP (ADR 0006, spike S3).
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-util = "0.7"
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# No unwrap/expect outside tests. For a proven-infallible spot use
# #[expect(clippy::expect_used, reason = "...")]. Tests are exempt via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
str_to_string = "warn"
manual_let_else = "warn"
implicit_clone = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
large_futures = "warn"
